<dialog class="ui-modal ui-modal-lg" id="gallery-modal" aria-label="Galerie">
  <div class="ui-modal-content">
    <div class="ui-modal-body">
      <div id="modal-carousel" class="ui-carousel">
        <div class="ui-carousel-inner"></div>
        <button class="ui-carousel-control-prev" type="button" data-carousel-slide="prev">
          <span class="ui-carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="sr-only">Vorheriges Bild</span>
        </button>
        <button class="ui-carousel-control-next" type="button" data-carousel-slide="next">
          <span class="ui-carousel-control-next-icon" aria-hidden="true"></span>
          <span class="sr-only">Nächstes Bild</span>
        </button>
      </div>
    </div>
    <div class="ui-modal-footer">
      <form method="dialog">
        <button type="submit" class="ui-btn ui-btn-outline-secondary">Schließen</button>
      </form>
    </div>
  </div>
</dialog>
